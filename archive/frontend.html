<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RainBird Controller - Backend API</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌱 RainBird Controller</h1>
            <div class="header-controls">
                <span class="connection-status disconnected" id="connectionStatus">Loading...</span>
                <button class="btn btn-secondary" onclick="window.showSettings()">⚙️ Settings</button>
                <button class="btn btn-danger" id="disconnectBtn" onclick="window.disconnect()" style="display: none;">Disconnect</button>
            </div>
        </header>

        <div class="control-panel" id="controlPanel">
            <!-- System Status Panel -->
            <div class="system-status" id="systemStatus" style="display: none;">
                <h3>System Status</h3>
                <div class="status-grid">
                    <div class="status-item">
                        <div class="status-label">Rain Sensor</div>
                        <div class="status-value" id="rainSensorStatus">--</div>
                    </div>
                    <div class="status-item">
                        <div class="status-label">Active Zone</div>
                        <div class="status-value" id="activeZoneStatus">None</div>
                    </div>
                    <div class="status-item">
                        <div class="status-label">Time Remaining</div>
                        <div class="status-value" id="timeRemainingStatus">--:--</div>
                    </div>
                    <div class="status-item">
                        <div class="status-label">Rain Delay</div>
                        <div class="status-value" id="rainDelayStatus">None</div>
                    </div>
                </div>
                
                <!-- Rain Delay Controls -->
                <div class="rain-delay-controls">
                    <h4>Rain Delay</h4>
                    <div class="delay-buttons">
                        <button class="btn btn-secondary" onclick="window.setRainDelay(24)">24h</button>
                        <button class="btn btn-secondary" onclick="window.setRainDelay(48)">48h</button>
                        <button class="btn btn-secondary" onclick="window.setRainDelay(72)">72h</button>
                        <button class="btn btn-danger" onclick="window.clearRainDelay()">Clear</button>
                    </div>
                </div>
            </div>

            <div class="main-content">
                <div class="zones-section">
                    <h2>
                        Irrigation Zones
                        <button class="btn btn-secondary btn-sm" onclick="window.refreshZones()">Refresh</button>
                    </h2>
                    <div class="zones-grid" id="zonesList">
                        <div class="loading-message">Loading zones...</div>
                    </div>
                </div>

                <div class="programs-section">
                    <h2>Programs</h2>
                    <div class="programs-controls">
                        <button class="btn btn-secondary btn-sm" onclick="window.refreshPrograms()">Refresh</button>
                    </div>
                    <div class="programs-list" id="programsList">
                        <div class="loading-message">Loading programs...</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Settings Modal -->
        <div id="settingsModal" class="modal" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Controller Settings</h2>
                    <button class="btn btn-secondary" onclick="window.closeSettings()">×</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="settingsIp">Controller IP Address:</label>
                        <input type="text" id="settingsIp" placeholder="192.168.1.113">
                    </div>
                    <div class="form-group">
                        <label for="settingsPassword">Password:</label>
                        <input type="password" id="settingsPassword" placeholder="Enter password">
                    </div>
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="autoConnect"> Auto-connect on page load
                        </label>
                    </div>
                    <div class="form-group">
                        <label for="refreshInterval">Refresh Interval (seconds):</label>
                        <input type="number" id="refreshInterval" min="1" max="60" value="5">
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary" onclick="window.saveSettings()">Save Settings</button>
                    <button class="btn btn-secondary" onclick="window.closeSettings()">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Backend API Client
        class RainBirdAPI {
            constructor() {
                this.baseUrl = '';
                this.connected = false;
            }

            async getZones() {
                const response = await fetch('/api/zones');
                return await response.json();
            }

            async startZone(zoneId, duration) {
                const response = await fetch('/api/zones/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ zone_id: zoneId, duration: duration })
                });
                return await response.json();
            }

            async stopZone(zoneId = null) {
                const response = await fetch('/api/zones/stop', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ zone_id: zoneId })
                });
                return await response.json();
            }

            async getSystemStatus() {
                const response = await fetch('/api/status');
                return await response.json();
            }

            async getPrograms() {
                const response = await fetch('/api/programs');
                return await response.json();
            }

            async runProgram(programId) {
                const response = await fetch('/api/programs/run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ program_id: programId })
                });
                return await response.json();
            }

            async setRainDelay(hours) {
                const response = await fetch('/api/rain-delay', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ hours: hours })
                });
                return await response.json();
            }

            async updateZoneName(zoneId, name) {
                const response = await fetch('/api/zones/name', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ zone_id: zoneId, name: name })
                });
                return await response.json();
            }

            async getSettings() {
                const response = await fetch('/api/settings');
                return await response.json();
            }

            async saveSettings(settings) {
                const response = await fetch('/api/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'save', settings: settings })
                });
                return await response.json();
            }
        }

        // Initialize API client
        const api = new RainBirdAPI();
        let statusUpdateInterval = null;

        // Page initialization
        window.addEventListener('load', async function() {
            console.log('🚀 Frontend loaded, connecting to backend...');
            await loadInitialData();
            startStatusUpdates();
        });

        async function loadInitialData() {
            try {
                // Load settings
                const settingsResult = await api.getSettings();
                if (settingsResult.success) {
                    window.currentSettings = settingsResult.settings;
                    updateConnectionStatus('connected');
                    
                    // Load zones and programs
                    await loadZones();
                    await loadPrograms();
                } else {
                    updateConnectionStatus('configure');
                }
            } catch (error) {
                console.error('Failed to load initial data:', error);
                updateConnectionStatus('error');
            }
        }

        async function loadZones() {
            try {
                const result = await api.getZones();
                if (result.success) {
                    displayZones(result.zones);
                } else {
                    document.getElementById('zonesList').innerHTML = 
                        `<div class="error-message">Error: ${result.error}</div>`;
                }
            } catch (error) {
                console.error('Failed to load zones:', error);
                document.getElementById('zonesList').innerHTML = 
                    '<div class="error-message">Failed to load zones</div>';
            }
        }

        async function loadPrograms() {
            try {
                const result = await api.getPrograms();
                if (result.success) {
                    displayPrograms(result.programs);
                } else {
                    document.getElementById('programsList').innerHTML = 
                        `<div class="error-message">Error: ${result.error}</div>`;
                }
            } catch (error) {
                console.error('Failed to load programs:', error);
                document.getElementById('programsList').innerHTML = 
                    '<div class="error-message">Failed to load programs</div>';
            }
        }

        function displayZones(zones) {
            const zonesList = document.getElementById('zonesList');
            let zonesHTML = '';

            zones.forEach(zone => {
                zonesHTML += `
                    <div class="zone-item" id="zone-${zone.id}">
                        <div class="zone-header">
                            <div class="zone-name" onclick="editZoneName(${zone.id})">${zone.name}</div>
                            <div class="zone-status-container">
                                <span class="zone-status inactive" id="zone-${zone.id}-status">Inactive</span>
                                <span class="zone-timer" id="zone-${zone.id}-timer" style="display: none;">--:--</span>
                            </div>
                        </div>
                        <div class="zone-controls">
                            <input type="number" class="duration-input" id="zone-${zone.id}-duration" 
                                   min="1" max="60" value="10" placeholder="Minutes">
                            <button class="btn btn-success" onclick="startZone(${zone.id})">Start</button>
                            <button class="btn btn-danger" onclick="stopZone(${zone.id})" style="display: none;">Stop</button>
                        </div>
                    </div>
                `;
            });

            // Add emergency stop
            zonesHTML += `
                <div class="zone-item emergency-controls">
                    <button class="btn btn-danger btn-large" onclick="stopAllZones()">🚨 STOP ALL ZONES</button>
                </div>
            `;

            zonesList.innerHTML = zonesHTML;
        }

        function displayPrograms(programs) {
            const programsList = document.getElementById('programsList');
            let programsHTML = '';

            programs.forEach(program => {
                programsHTML += `
                    <div class="program-item">
                        <div class="program-header">
                            <h4>${program.name}</h4>
                            <span class="program-status enabled">Available</span>
                        </div>
                        <div class="program-actions">
                            <button class="btn btn-success" onclick="runProgram('${program.id}')">Run Now</button>
                        </div>
                    </div>
                `;
            });

            programsList.innerHTML = programsHTML || '<div class="info-message">No programs available</div>';
        }

        // Zone control functions
        async function startZone(zoneId) {
            const durationInput = document.getElementById(`zone-${zoneId}-duration`);
            const duration = parseInt(durationInput.value) || 10;

            try {
                const result = await api.startZone(zoneId, duration);
                if (result.success) {
                    showMessage(`Zone ${zoneId} started for ${duration} minutes`, 'success');
                    updateZoneStatus(zoneId, 'active', duration);
                } else {
                    showMessage(`Failed to start Zone ${zoneId}: ${result.error}`, 'error');
                }
            } catch (error) {
                showMessage(`Error starting Zone ${zoneId}: ${error.message}`, 'error');
            }
        }

        async function stopZone(zoneId) {
            try {
                const result = await api.stopZone(zoneId);
                if (result.success) {
                    showMessage(`Zone ${zoneId} stopped`, 'success');
                    updateZoneStatus(zoneId, 'inactive');
                } else {
                    showMessage(`Failed to stop Zone ${zoneId}: ${result.error}`, 'error');
                }
            } catch (error) {
                showMessage(`Error stopping Zone ${zoneId}: ${error.message}`, 'error');
            }
        }

        async function stopAllZones() {
            try {
                const result = await api.stopZone();
                if (result.success) {
                    showMessage('All zones stopped', 'success');
                    // Update all zone statuses
                    document.querySelectorAll('[id^="zone-"][id$="-status"]').forEach(el => {
                        const zoneId = el.id.match(/zone-(\d+)-status/)[1];
                        updateZoneStatus(parseInt(zoneId), 'inactive');
                    });
                } else {
                    showMessage(`Failed to stop all zones: ${result.error}`, 'error');
                }
            } catch (error) {
                showMessage(`Error stopping all zones: ${error.message}`, 'error');
            }
        }

        async function runProgram(programId) {
            try {
                const result = await api.runProgram(programId);
                if (result.success) {
                    showMessage(`Program ${programId} started`, 'success');
                } else {
                    showMessage(`Failed to run Program ${programId}: ${result.error}`, 'error');
                }
            } catch (error) {
                showMessage(`Error running Program ${programId}: ${error.message}`, 'error');
            }
        }

        // Rain delay functions
        window.setRainDelay = async function(hours) {
            try {
                const result = await api.setRainDelay(hours);
                if (result.success) {
                    showMessage(`Rain delay set for ${hours} hours`, 'success');
                    updateRainDelayStatus(hours);
                } else {
                    showMessage(`Failed to set rain delay: ${result.error}`, 'error');
                }
            } catch (error) {
                showMessage(`Error setting rain delay: ${error.message}`, 'error');
            }
        };

        window.clearRainDelay = async function() {
            try {
                const result = await api.setRainDelay(0);
                if (result.success) {
                    showMessage('Rain delay cleared', 'success');
                    updateRainDelayStatus(0);
                } else {
                    showMessage(`Failed to clear rain delay: ${result.error}`, 'error');
                }
            } catch (error) {
                showMessage(`Error clearing rain delay: ${error.message}`, 'error');
            }
        };

        // Status updates
        async function updateSystemStatus() {
            try {
                const result = await api.getSystemStatus();
                if (result.success) {
                    const status = result.status;
                    
                    // Update system status display
                    document.getElementById('systemStatus').style.display = 'block';
                    
                    // Rain sensor
                    if (status.rain_sensor) {
                        const rainEl = document.getElementById('rainSensorStatus');
                        rainEl.textContent = status.rain_sensor.status;
                        rainEl.style.color = status.rain_sensor.active ? '#dc3545' : '#28a745';
                    }
                    
                    // Irrigation state
                    if (status.irrigation_state) {
                        const activeZoneEl = document.getElementById('activeZoneStatus');
                        const timeEl = document.getElementById('timeRemainingStatus');
                        
                        if (status.irrigation_state.active && status.irrigation_state.zone) {
                            activeZoneEl.textContent = `Zone ${status.irrigation_state.zone}`;
                            timeEl.textContent = formatTime(status.irrigation_state.time_remaining);
                        } else {
                            activeZoneEl.textContent = 'None';
                            timeEl.textContent = '--:--';
                        }
                    }
                }
            } catch (error) {
                console.error('Failed to update system status:', error);
            }
        }

        function startStatusUpdates() {
            if (statusUpdateInterval) {
                clearInterval(statusUpdateInterval);
            }
            
            const interval = (window.currentSettings?.refresh_interval || 5) * 1000;
            statusUpdateInterval = setInterval(updateSystemStatus, interval);
            updateSystemStatus(); // Initial update
        }

        // Utility functions
        function updateConnectionStatus(status) {
            const statusEl = document.getElementById('connectionStatus');
            const disconnectBtn = document.getElementById('disconnectBtn');
            
            switch (status) {
                case 'connected':
                    statusEl.textContent = 'Connected';
                    statusEl.className = 'connection-status connected';
                    disconnectBtn.style.display = 'inline-block';
                    break;
                case 'configure':
                    statusEl.textContent = 'Configure Settings';
                    statusEl.className = 'connection-status disconnected';
                    disconnectBtn.style.display = 'none';
                    break;
                case 'error':
                    statusEl.textContent = 'Connection Error';
                    statusEl.className = 'connection-status disconnected';
                    disconnectBtn.style.display = 'none';
                    break;
            }
        }

        function updateZoneStatus(zoneId, status, duration = null) {
            const statusEl = document.getElementById(`zone-${zoneId}-status`);
            const timerEl = document.getElementById(`zone-${zoneId}-timer`);
            const startBtn = statusEl?.closest('.zone-item')?.querySelector('.btn-success');
            const stopBtn = statusEl?.closest('.zone-item')?.querySelector('.btn-danger');
            
            if (!statusEl) return;
            
            if (status === 'active') {
                statusEl.textContent = 'Running';
                statusEl.className = 'zone-status active';
                if (startBtn) startBtn.style.display = 'none';
                if (stopBtn) stopBtn.style.display = 'inline-block';
                if (timerEl && duration) {
                    timerEl.style.display = 'inline-block';
                    startZoneTimer(zoneId, duration);
                }
            } else {
                statusEl.textContent = 'Inactive';
                statusEl.className = 'zone-status inactive';
                if (startBtn) startBtn.style.display = 'inline-block';
                if (stopBtn) stopBtn.style.display = 'none';
                if (timerEl) timerEl.style.display = 'none';
            }
        }

        function updateRainDelayStatus(hours) {
            const statusEl = document.getElementById('rainDelayStatus');
            if (hours > 0) {
                statusEl.textContent = `${hours}h`;
                statusEl.style.color = '#dc3545';
            } else {
                statusEl.textContent = 'None';
                statusEl.style.color = '#28a745';
            }
        }

        function formatTime(seconds) {
            if (!seconds) return '--:--';
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        let zoneTimers = {};
        function startZoneTimer(zoneId, minutes) {
            let seconds = minutes * 60;
            const timerEl = document.getElementById(`zone-${zoneId}-timer`);
            
            if (zoneTimers[zoneId]) {
                clearInterval(zoneTimers[zoneId]);
            }
            
            zoneTimers[zoneId] = setInterval(() => {
                timerEl.textContent = formatTime(seconds);
                seconds--;
                if (seconds < 0) {
                    updateZoneStatus(zoneId, 'inactive');
                }
            }, 1000);
        }

        function showMessage(message, type = 'info') {
            console.log(`${type.toUpperCase()}: ${message}`);
            // Could implement toast notifications here
        }

        // Settings functions
        window.showSettings = async function() {
            try {
                const result = await api.getSettings();
                if (result.success) {
                    const settings = result.settings;
                    document.getElementById('settingsIp').value = settings.controller_ip || '';
                    document.getElementById('settingsPassword').value = settings.controller_password || '';
                    document.getElementById('autoConnect').checked = settings.auto_connect || false;
                    document.getElementById('refreshInterval').value = settings.refresh_interval || 5;
                }
            } catch (error) {
                console.error('Failed to load settings:', error);
            }
            document.getElementById('settingsModal').style.display = 'flex';
        };

        window.closeSettings = function() {
            document.getElementById('settingsModal').style.display = 'none';
        };

        window.saveSettings = async function() {
            const settings = {
                controller_ip: document.getElementById('settingsIp').value,
                controller_password: document.getElementById('settingsPassword').value,
                auto_connect: document.getElementById('autoConnect').checked,
                refresh_interval: parseInt(document.getElementById('refreshInterval').value) || 5,
                zone_names: window.currentSettings?.zone_names || {}
            };

            try {
                const result = await api.saveSettings(settings);
                if (result.success) {
                    window.currentSettings = settings;
                    showMessage('Settings saved successfully', 'success');
                    window.closeSettings();
                    
                    // Reload data with new settings
                    await loadInitialData();
                    startStatusUpdates();
                } else {
                    showMessage('Failed to save settings', 'error');
                }
            } catch (error) {
                showMessage(`Error saving settings: ${error.message}`, 'error');
            }
        };

        // Refresh functions
        window.refreshZones = loadZones;
        window.refreshPrograms = loadPrograms;

        // Zone name editing
        async function editZoneName(zoneId) {
            const nameEl = document.querySelector(`#zone-${zoneId} .zone-name`);
            const currentName = nameEl.textContent;
            
            const newName = prompt('Enter new zone name:', currentName);
            if (newName && newName !== currentName) {
                try {
                    const result = await api.updateZoneName(zoneId, newName);
                    if (result.success) {
                        nameEl.textContent = newName;
                        showMessage(`Zone ${zoneId} renamed to "${newName}"`, 'success');
                    } else {
                        showMessage('Failed to update zone name', 'error');
                    }
                } catch (error) {
                    showMessage(`Error updating zone name: ${error.message}`, 'error');
                }
            }
        }
    </script>
</body>
</html>
