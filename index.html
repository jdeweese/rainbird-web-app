<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RainBird</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --brand: #1a73e8;
            --brand-dark: #1557b0;
            --ok: #1e8e3e;
            --ok-bg: #e6f4ea;
            --ok-border: #a8d5b5;
            --warn: #e37400;
            --danger: #d93025;
            --text: #202124;
            --text-2: #5f6368;
            --border: #dadce0;
            --surface: #ffffff;
            --bg: #f1f3f4;
            --radius: 12px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            color: var(--text);
            font-size: 14px;
        }

        /* ── Layout ────────────────────────────────────── */
        .app { display: flex; flex-direction: column; min-height: 100vh; }

        .topbar {
            background: var(--brand);
            color: #fff;
            padding: 0 16px;
            height: 56px;
            display: flex;
            align-items: center;
            gap: 12px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 8px rgba(0,0,0,.18);
        }

        .topbar-title {
            font-size: 18px;
            font-weight: 500;
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .conn-dot {
            width: 9px; height: 9px;
            border-radius: 50%;
            background: rgba(255,255,255,.35);
            flex-shrink: 0;
            transition: background .4s;
        }
        .conn-dot.ok  { background: #34a853; box-shadow: 0 0 0 3px rgba(52,168,83,.25); }
        .conn-dot.err { background: #ea4335; box-shadow: 0 0 0 3px rgba(234,67,53,.25); }

        .topbar-status { font-size: 12px; opacity: .85; }

        .icon-btn {
            background: rgba(255,255,255,.12);
            border: none; color: #fff;
            width: 36px; height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background .2s;
            flex-shrink: 0;
        }
        .icon-btn:hover { background: rgba(255,255,255,.22); }

        .main { flex: 1; padding: 16px; max-width: 900px; margin: 0 auto; width: 100%; }

        /* ── Active banner ──────────────────────────────── */
        .active-banner {
            display: none;
            background: var(--ok-bg);
            border: 1px solid var(--ok-border);
            border-left: 4px solid var(--ok);
            border-radius: var(--radius);
            padding: 16px 20px;
            margin-bottom: 16px;
        }
        .active-banner.show { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }

        .banner-info { flex: 1; min-width: 0; }
        .banner-label { font-size: 11px; font-weight: 600; text-transform: uppercase;
                        letter-spacing: .8px; color: var(--ok); margin-bottom: 2px; }
        .banner-zone  { font-size: 20px; font-weight: 500; color: #0d652d;
                        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .banner-timer {
            font-size: 36px; font-weight: 300; color: #0d652d;
            font-variant-numeric: tabular-nums; line-height: 1;
            white-space: nowrap;
        }

        .banner-controls {
            display: flex; align-items: center; gap: 8px; flex-shrink: 0;
        }

        .btn-adjust {
            background: rgba(255,255,255,.15);
            border: 1px solid rgba(255,255,255,.3);
            color: #0d652d; width: 36px; height: 36px; border-radius: 50%;
            font-size: 20px; font-weight: 300; cursor: pointer; line-height: 1;
            display: flex; align-items: center; justify-content: center;
            transition: background .15s; flex-shrink: 0;
            background: var(--ok-bg); border-color: var(--ok-border);
        }
        .btn-adjust:hover { background: #c8e6c9; }
        .btn-adjust:disabled { opacity: .4; cursor: default; }

        .adjust-label {
            font-size: 11px; color: var(--ok); text-align: center;
            white-space: nowrap; min-width: 40px;
        }

        .btn-stop-banner {
            background: var(--danger);
            color: #fff; border: none;
            padding: 8px 18px; border-radius: 20px;
            font-size: 13px; font-weight: 500; cursor: pointer;
            display: flex; align-items: center; gap: 6px;
            transition: background .2s; white-space: nowrap;
        }
        .btn-stop-banner:hover { background: #b52d22; }

        /* ── Zone grid ──────────────────────────────────── */
        .section-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 12px;
        }
        .section-title { font-size: 13px; font-weight: 600; color: var(--text-2);
                         text-transform: uppercase; letter-spacing: .6px; }

        .zones-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 12px;
        }

        .zone-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            transition: box-shadow .15s, border-color .15s;
        }
        .zone-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.1); }
        .zone-card.active {
            border-color: var(--ok);
            background: var(--ok-bg);
            box-shadow: 0 0 0 2px rgba(30,142,62,.18);
        }

        .zone-header {
            display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
        }

        .zone-num {
            width: 28px; height: 28px;
            background: var(--brand);
            color: #fff; border-radius: 50%;
            font-size: 12px; font-weight: 600;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .zone-card.active .zone-num { background: var(--ok); }

        .zone-name-wrap { flex: 1; min-width: 0; }

        .zone-name {
            font-size: 15px; font-weight: 500;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            cursor: pointer;
            padding: 2px 4px; border-radius: 4px;
            transition: background .15s;
        }
        .zone-name:hover { background: rgba(0,0,0,.05); }

        .zone-name-input {
            width: 100%; font-size: 15px; font-weight: 500;
            border: 1px solid var(--brand); border-radius: 4px;
            padding: 2px 6px; outline: none; font-family: inherit;
            background: #fff;
        }

        .zone-name-hint {
            font-size: 11px; color: var(--text-2); margin-top: 1px;
            height: 14px; transition: opacity .3s;
        }

        /* Duration chips */
        .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }

        .chip {
            padding: 4px 12px; border-radius: 16px;
            border: 1px solid var(--border);
            background: var(--bg); color: var(--text-2);
            font-size: 12px; font-weight: 500; cursor: pointer;
            transition: all .15s; user-select: none;
        }
        .chip:hover  { border-color: var(--brand); color: var(--brand); background: #e8f0fe; }
        .chip.active { border-color: var(--brand); color: #fff; background: var(--brand); }

        .chip-custom {
            display: flex; align-items: center; gap: 4px;
            padding: 4px 8px; border-radius: 16px;
            border: 1px solid var(--border);
            background: var(--bg); cursor: text;
            transition: border-color .15s;
        }
        .chip-custom:focus-within { border-color: var(--brand); }
        .chip-custom input {
            width: 36px; border: none; background: transparent;
            font-size: 12px; font-weight: 500; color: var(--text);
            font-family: inherit; outline: none; text-align: center;
        }
        .chip-custom span { font-size: 11px; color: var(--text-2); }

        /* Run / Stop buttons */
        .zone-actions { display: flex; gap: 8px; }

        .btn-run {
            flex: 1; padding: 9px 0;
            background: var(--brand); color: #fff; border: none;
            border-radius: 8px; font-size: 13px; font-weight: 500;
            cursor: pointer; display: flex; align-items: center;
            justify-content: center; gap: 6px;
            transition: background .2s;
        }
        .btn-run:hover:not(:disabled) { background: var(--brand-dark); }
        .btn-run:disabled { opacity: .45; cursor: default; }

        .btn-stop {
            padding: 9px 14px;
            background: transparent; color: var(--danger);
            border: 1px solid var(--danger); border-radius: 8px;
            font-size: 13px; font-weight: 500; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 4px;
            transition: all .2s;
        }
        .btn-stop:hover { background: var(--danger); color: #fff; }

        /* ── Config mode ───────────────────────────────── */
        .config-bar {
            background: #fff8e1;
            border: 1px solid #ffe082;
            border-left: 4px solid var(--warn);
            border-radius: var(--radius);
            padding: 10px 16px;
            margin-bottom: 16px;
            display: flex; align-items: center; gap: 12px;
            font-size: 13px; color: #5d4037;
        }
        .config-bar .material-icons { font-size: 18px; color: var(--warn); flex-shrink: 0; }
        .config-bar-text { flex: 1; }

        .btn-done {
            background: var(--warn); color: #fff; border: none;
            border-radius: 8px; padding: 6px 16px;
            font-size: 13px; font-weight: 500; cursor: pointer;
            display: flex; align-items: center; gap: 4px;
            transition: background .2s; white-space: nowrap; flex-shrink: 0;
        }
        .btn-done:hover { background: #c76300; }

        .zone-card.zone-hidden {
            opacity: .45;
            border-style: dashed;
        }
        .zone-card.zone-hidden:hover { opacity: .65; }

        .btn-vis {
            width: 100%; padding: 9px 0;
            border: 1px solid var(--border); border-radius: 8px;
            background: var(--bg); color: var(--text-2);
            font-size: 13px; font-weight: 500; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 6px;
            transition: all .15s;
        }
        .btn-vis:hover { border-color: var(--brand); color: var(--brand); background: #e8f0fe; }
        .zone-card.zone-hidden .btn-vis {
            border-color: var(--ok); color: var(--ok); background: var(--ok-bg);
        }
        .zone-card.zone-hidden .btn-vis:hover { background: #c8e6c9; }

        .edit-zones-btn {
            background: none; color: var(--text-2);
            border: 1px solid var(--border); border-radius: 8px;
            padding: 4px 12px; font-size: 12px; font-weight: 500;
            cursor: pointer; display: flex; align-items: center; gap: 4px;
            transition: all .15s;
        }
        .edit-zones-btn:hover { border-color: var(--brand); color: var(--brand); }

        /* ── Unconfigured state ─────────────────────────── */
        .empty-state {
            text-align: center; padding: 48px 24px;
            background: var(--surface); border-radius: var(--radius);
            border: 1px dashed var(--border);
        }
        .empty-state .material-icons { font-size: 48px; color: var(--border); margin-bottom: 12px; }
        .empty-state h2 { font-size: 16px; font-weight: 500; margin-bottom: 6px; }
        .empty-state p  { color: var(--text-2); margin-bottom: 20px; }
        .btn-primary {
            display: inline-flex; align-items: center; gap: 6px;
            background: var(--brand); color: #fff; border: none;
            padding: 10px 20px; border-radius: 8px;
            font-size: 14px; font-weight: 500; cursor: pointer;
            transition: background .2s;
        }
        .btn-primary:hover { background: var(--brand-dark); }

        /* ── Toast ──────────────────────────────────────── */
        #toast-container {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            z-index: 9999; display: flex; flex-direction: column; gap: 8px;
            align-items: center; pointer-events: none;
        }
        .toast {
            background: #323232; color: #fff;
            padding: 10px 20px; border-radius: 8px;
            font-size: 13px; font-weight: 400;
            box-shadow: 0 4px 12px rgba(0,0,0,.25);
            animation: toast-in .2s ease;
            pointer-events: auto;
        }
        .toast.error { background: #d93025; }
        .toast.ok    { background: var(--ok); }
        @keyframes toast-in { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }

        /* ── Settings popup ─────────────────────────────── */
        .overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,.45);
            display: none; align-items: center; justify-content: center;
            padding: 16px; z-index: 500;
        }
        .overlay.show { display: flex; }

        .panel {
            background: var(--surface);
            border-radius: var(--radius);
            width: 100%; max-width: 420px;
            box-shadow: 0 8px 32px rgba(0,0,0,.2);
            overflow: hidden;
        }
        .panel-header {
            padding: 16px 20px;
            display: flex; align-items: center; gap: 10px;
            border-bottom: 1px solid var(--border);
        }
        .panel-header .material-icons { color: var(--brand); }
        .panel-title { font-size: 16px; font-weight: 600; flex: 1; }
        .close-btn {
            background: none; border: none; cursor: pointer;
            color: var(--text-2); width: 32px; height: 32px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            transition: background .15s;
        }
        .close-btn:hover { background: var(--bg); }

        .panel-body { padding: 20px; display: flex; flex-direction: column; gap: 16px; }

        .field label {
            display: block; font-size: 12px; font-weight: 500;
            color: var(--text-2); margin-bottom: 4px;
            text-transform: uppercase; letter-spacing: .5px;
        }
        .field-row { display: flex; gap: 8px; align-items: stretch; }
        .field-row input { flex: 1; }

        input[type="text"], input[type="password"], input[type="number"] {
            width: 100%; padding: 9px 12px;
            border: 1px solid var(--border); border-radius: 8px;
            font-size: 14px; font-family: inherit; color: var(--text);
            background: var(--surface); outline: none;
            transition: border-color .15s;
        }
        input:focus { border-color: var(--brand); }

        .scan-btn {
            background: var(--bg); color: var(--text);
            border: 1px solid var(--border); border-radius: 8px;
            padding: 0 14px; font-size: 13px; font-weight: 500;
            cursor: pointer; white-space: nowrap;
            display: flex; align-items: center; gap: 6px;
            transition: border-color .15s, background .15s;
        }
        .scan-btn:hover { border-color: var(--brand); color: var(--brand); background: #e8f0fe; }
        .scan-btn:disabled { opacity: .5; cursor: default; }

        .scan-results {
            display: none;
            border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
            margin-top: -8px;
        }
        .scan-result-item {
            width: 100%; background: none; border: none;
            border-bottom: 1px solid var(--border);
            padding: 10px 14px; cursor: pointer;
            display: flex; align-items: center; gap: 10px;
            font-size: 13px; color: var(--text); text-align: left;
            transition: background .15s;
        }
        .scan-result-item:last-child { border-bottom: none; }
        .scan-result-item:hover { background: var(--bg); }
        .scan-result-item .material-icons { font-size: 16px; color: var(--ok); }
        .scan-result-item .scan-hint { margin-left: auto; font-size: 11px; color: var(--text-2); }

        .panel-footer {
            padding: 12px 20px;
            display: flex; justify-content: flex-end; gap: 10px;
            border-top: 1px solid var(--border);
        }
        .btn-cancel {
            background: none; color: var(--text-2);
            border: 1px solid var(--border); border-radius: 8px;
            padding: 8px 18px; font-size: 13px; font-weight: 500;
            cursor: pointer; transition: all .15s;
        }
        .btn-cancel:hover { border-color: var(--text-2); color: var(--text); }

        .btn-save {
            background: var(--brand); color: #fff; border: none;
            border-radius: 8px; padding: 8px 20px;
            font-size: 13px; font-weight: 500; cursor: pointer;
            display: flex; align-items: center; gap: 6px;
            transition: background .2s;
        }
        .btn-save:hover { background: var(--brand-dark); }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .zones-grid { grid-template-columns: 1fr; }
            .banner-timer { font-size: 28px; }
        }
    </style>
</head>
<body>
<div class="app">

    <!-- Top bar -->
    <div class="topbar">
        <div class="conn-dot" id="connDot"></div>
        <div class="topbar-title">
            <span class="material-icons" style="font-size:20px;">grass</span>
            RainBird
        </div>
        <span class="topbar-status" id="connLabel">Not connected</span>
        <button class="icon-btn" onclick="openSettings()" title="Settings" aria-label="Settings">
            <span class="material-icons" style="font-size:20px;">settings</span>
        </button>
    </div>

    <div class="main">

        <!-- Active zone banner -->
        <div class="active-banner" id="activeBanner">
            <div class="banner-info">
                <div class="banner-label">Running now</div>
                <div class="banner-zone" id="bannerZoneName">—</div>
            </div>
            <div class="banner-timer" id="bannerTimer">--:--</div>
            <div class="banner-controls">
                <div style="display:flex;flex-direction:column;align-items:center;gap:2px;">
                    <button class="btn-adjust" id="adjMinus" onclick="adjustTime(-5)" title="−5 min">−</button>
                    <span class="adjust-label">5 min</span>
                </div>
                <div style="display:flex;flex-direction:column;align-items:center;gap:2px;">
                    <button class="btn-adjust" id="adjPlus" onclick="adjustTime(5)" title="+5 min">+</button>
                    <span class="adjust-label">5 min</span>
                </div>
                <button class="btn-stop-banner" onclick="stopAll()">
                    <span class="material-icons" style="font-size:16px;">stop</span>
                    Stop
                </button>
            </div>
        </div>

        <!-- Config mode banner -->
        <div class="config-bar" id="configBar" style="display:none;">
            <span class="material-icons">tune</span>
            <span class="config-bar-text">Tap the eye icon on each zone to show or hide it.</span>
            <button class="btn-done" onclick="exitConfigMode()">
                <span class="material-icons" style="font-size:16px;">check</span>
                Done
            </button>
        </div>

        <!-- Zone grid / empty state -->
        <div id="zonesArea"></div>

    </div>
</div>

<!-- Toast container -->
<div id="toast-container"></div>

<!-- Settings popup -->
<div class="overlay" id="settingsOverlay" role="dialog" aria-labelledby="settingsTitle">
    <div class="panel">
        <div class="panel-header">
            <span class="material-icons">settings</span>
            <div class="panel-title" id="settingsTitle">Settings</div>
            <button class="close-btn" onclick="closeSettings()" aria-label="Close">
                <span class="material-icons">close</span>
            </button>
        </div>
        <div class="panel-body">
            <div class="field">
                <label>Controller IP address</label>
                <div class="field-row">
                    <input type="text" id="cfgIp" inputmode="numeric" placeholder="192.168.1.109">
                    <button class="scan-btn" id="scanBtn" onclick="scanNetwork()">
                        <span class="material-icons" style="font-size:16px;" id="scanIcon">wifi_find</span>
                        Scan
                    </button>
                </div>
                <div class="scan-results" id="scanResults"></div>
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" id="cfgPwd" placeholder="Controller password">
            </div>
            <div class="field">
                <label>Status refresh (seconds)</label>
                <input type="number" id="cfgRefresh" min="2" max="60" placeholder="5">
            </div>
        </div>
        <div class="panel-footer">
            <button class="btn-cancel" onclick="closeSettings()">Cancel</button>
            <button class="btn-save" onclick="saveSettings()">
                <span class="material-icons" style="font-size:16px;">save</span>
                Save
            </button>
        </div>
    </div>
</div>

<script>
// ── Constants ──────────────────────────────────────────
const DURATION_CHIPS   = [5, 10, 15, 30, 45];
const LAST_DUR_KEY     = 'rb_last_dur';
const VISIBLE_KEY      = 'rb_visible';

// ── State ──────────────────────────────────────────────
let allZones = [];           // [{id, name}]
let visibleIds = [];         // zone ids to show (empty = all)
let configMode = false;      // true while editing zone visibility
let selectedDur = {};        // zoneId → minutes (in-memory)
let lastDur = loadJson(LAST_DUR_KEY, {});
let activeZone = null;       // {zone_id, name, time_remaining, duration_seconds}
let refreshSec = 5;
let statusTimer = null;
let countdownTimer = null;
let configured = false;

// ── Boot ───────────────────────────────────────────────
window.addEventListener('load', async () => {
    await fetchSettings();
    await fetchZones();
    startPolling();
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) { clearInterval(statusTimer); statusTimer = null; }
        else if (!statusTimer) startPolling();
    });
});

// ── Settings ───────────────────────────────────────────
async function fetchSettings() {
    try {
        const r = await post('/api/settings', { action: 'load' });
        if (!r.ok) return;
        const s = r.data.settings || {};
        configured = !!(s.controller_ip && s.controller_password);
        refreshSec = Math.max(2, s.refresh_interval || 5);

        const stored = loadJson(VISIBLE_KEY, null);
        visibleIds = (s.visible_zones && s.visible_zones.length)
            ? s.visible_zones
            : stored || [];
    } catch {}
}

async function saveSettings() {
    const ip      = document.getElementById('cfgIp').value.trim();
    const pwd     = document.getElementById('cfgPwd').value;
    const refresh = parseInt(document.getElementById('cfgRefresh').value) || 5;

    const settings = { controller_ip: ip, controller_password: pwd,
                       refresh_interval: refresh, visible_zones: visibleIds };
    const r = await post('/api/settings', { action: 'save', settings });
    if (r.ok && r.data.success) {
        configured = !!(ip && pwd);
        refreshSec = refresh;
        closeSettings();
        await fetchZones();
        restartPolling();
        toast('Settings saved', 'ok');
    } else {
        toast('Save failed', 'error');
    }
}

function openSettings() {
    post('/api/settings', { action: 'load' }).then(r => {
        if (!r.ok) return;
        const s = r.data.settings || {};
        document.getElementById('cfgIp').value = s.controller_ip || '';
        document.getElementById('cfgPwd').value = s.controller_password || '';
        document.getElementById('cfgRefresh').value = s.refresh_interval || 5;
    });
    document.getElementById('scanResults').style.display = 'none';
    document.getElementById('settingsOverlay').classList.add('show');
}

function closeSettings() {
    document.getElementById('settingsOverlay').classList.remove('show');
}

// ── Network scan ───────────────────────────────────────
async function scanNetwork() {
    const btn  = document.getElementById('scanBtn');
    const icon = document.getElementById('scanIcon');
    const res  = document.getElementById('scanResults');
    btn.disabled = true;
    icon.style.animation = 'spin 1s linear infinite';
    icon.textContent = 'refresh';
    res.style.display = 'none';
    res.innerHTML = '';

    try {
        const r = await fetch('/api/scan');
        const data = await r.json();
        const ips = (data.controllers || []);
        if (!ips.length) {
            res.innerHTML = `<button class="scan-result-item" disabled style="cursor:default;color:var(--text-2);">
                <span class="material-icons">search_off</span> No devices found on port 80</button>`;
        } else {
            res.innerHTML = ips.map(ip => `
                <button class="scan-result-item" onclick="pickIp('${ip}')">
                    <span class="material-icons">router</span>
                    ${ip}
                    <span class="scan-hint">tap to use</span>
                </button>`).join('');
        }
        res.style.display = 'block';
    } catch (e) {
        res.innerHTML = `<button class="scan-result-item" disabled style="color:var(--danger);">Scan failed: ${e.message}</button>`;
        res.style.display = 'block';
    } finally {
        btn.disabled = false;
        icon.style.animation = '';
        icon.textContent = 'wifi_find';
    }
}

function pickIp(ip) {
    document.getElementById('cfgIp').value = ip;
    document.getElementById('scanResults').style.display = 'none';
    document.getElementById('cfgPwd').focus();
}

// ── Zones ──────────────────────────────────────────────
async function fetchZones() {
    try {
        const r = await fetch('/api/zones');
        const d = await r.json();
        if (d.success) allZones = d.zones;
    } catch {}
    renderZones();
}

function getVisibleZones() {
    if (!visibleIds || !visibleIds.length) return allZones;
    return allZones.filter(z => visibleIds.includes(z.id));
}

function isZoneVisible(zoneId) {
    return !visibleIds.length || visibleIds.includes(zoneId);
}

function renderZones() {
    const area = document.getElementById('zonesArea');
    document.getElementById('configBar').style.display = configMode ? 'flex' : 'none';

    if (!configured) {
        area.innerHTML = `
            <div class="empty-state">
                <div class="material-icons">settings_remote</div>
                <h2>No controller configured</h2>
                <p>Enter your RainBird controller's IP address and password to get started.</p>
                <button class="btn-primary" onclick="openSettings()">
                    <span class="material-icons" style="font-size:16px;">settings</span>
                    Open Settings
                </button>
            </div>`;
        return;
    }

    const displayZones = configMode ? allZones : getVisibleZones();

    if (!configMode && !displayZones.length) {
        area.innerHTML = `
            <div class="empty-state">
                <div class="material-icons">visibility_off</div>
                <h2>All zones hidden</h2>
                <p>Use Edit Zones to make zones visible again.</p>
                <button class="btn-primary" onclick="enterConfigMode()">
                    <span class="material-icons" style="font-size:16px;">tune</span>
                    Edit Zones
                </button>
            </div>`;
        return;
    }

    const isActive = activeZone && activeZone.zone_id;
    area.innerHTML = `
        <div class="section-header">
            <span class="section-title">${configMode ? 'Edit Zones' : 'Zones'}</span>
            ${!configMode ? `<button class="edit-zones-btn" onclick="enterConfigMode()">
                <span class="material-icons" style="font-size:15px;">tune</span>
                Edit zones
            </button>` : ''}
        </div>
        <div class="zones-grid">
            ${displayZones.map(z => renderZoneCard(z, isActive)).join('')}
        </div>`;
}

function renderZoneCard(zone, anyActive) {
    const isThisActive = activeZone && activeZone.zone_id === zone.id;
    const visible = isZoneVisible(zone.id);
    const dur = selectedDur[zone.id] ?? lastDur[zone.id] ?? 10;
    const customVal = DURATION_CHIPS.includes(dur) ? '' : dur;

    const chips = DURATION_CHIPS.map(m => `
        <button class="chip ${dur === m ? 'active' : ''}"
                onclick="setDur(${zone.id}, ${m})">${m}m</button>`).join('');

    const customChip = `
        <div class="chip-custom" title="Custom minutes" onclick="this.querySelector('input').focus()">
            <input type="number" min="1" max="120" value="${customVal}"
                   placeholder="?" id="custom-${zone.id}"
                   oninput="setDur(${zone.id}, +this.value || 0)"
                   onkeydown="if(event.key==='Enter') document.getElementById('run-${zone.id}').click()">
            <span>min</span>
        </div>`;

    const runDisabled = anyActive && !isThisActive;

    const actions = configMode
        ? `<button class="btn-vis" onclick="toggleZoneVisibility(${zone.id})">
               <span class="material-icons" style="font-size:16px;">${visible ? 'visibility' : 'visibility_off'}</span>
               ${visible ? 'Visible — tap to hide' : 'Hidden — tap to show'}
           </button>`
        : isThisActive
            ? `<button class="btn-stop" onclick="stopAll()">
                   <span class="material-icons" style="font-size:16px;">stop</span> Stop
               </button>`
            : `<button class="btn-run" id="run-${zone.id}"
                       onclick="runZone(${zone.id})" ${runDisabled ? 'disabled' : ''}>
                   <span class="material-icons" style="font-size:16px;">play_arrow</span>
                   Run ${dur}m
               </button>`;

    return `
        <div class="zone-card ${isThisActive ? 'active' : ''} ${configMode && !visible ? 'zone-hidden' : ''}" id="card-${zone.id}">
            <div class="zone-header">
                <div class="zone-num">${zone.id}</div>
                <div class="zone-name-wrap">
                    <div class="zone-name" id="name-${zone.id}"
                         ${configMode ? '' : `onclick="editName(${zone.id})" title="Click to rename"`}
                         style="${configMode ? 'cursor:default;' : ''}">${esc(zone.name)}</div>
                    <div class="zone-name-hint" id="hint-${zone.id}"></div>
                </div>
            </div>
            ${configMode ? '' : `<div class="chips">${chips}${customChip}</div>`}
            <div class="zone-actions">${actions}</div>
        </div>`;
}

// ── Config mode (zone visibility) ─────────────────────
function enterConfigMode() {
    configMode = true;
    renderZones();
}

async function exitConfigMode() {
    configMode = false;
    // Persist visible_zones to server
    const r = await post('/api/settings', { action: 'save', settings: { visible_zones: visibleIds } });
    if (!r.ok || !r.data.success) toast('Could not save zone visibility', 'error');
    saveJson(VISIBLE_KEY, visibleIds);
    renderZones();
}

function toggleZoneVisibility(zoneId) {
    const visible = isZoneVisible(zoneId);
    if (visible) {
        // Hide: ensure visibleIds is fully populated first, then remove this one
        if (!visibleIds.length) visibleIds = allZones.map(z => z.id);
        visibleIds = visibleIds.filter(id => id !== zoneId);
    } else {
        // Show
        visibleIds = [...visibleIds, zoneId].sort((a, b) => a - b);
    }
    // Re-render just this card so the rest stay stable
    const card = document.getElementById(`card-${zoneId}`);
    if (card) {
        const zone = allZones.find(z => z.id === zoneId);
        const newCard = document.createElement('div');
        newCard.innerHTML = renderZoneCard(zone, false);
        card.replaceWith(newCard.firstElementChild);
    }
}

// ── Duration selection ─────────────────────────────────
function setDur(zoneId, mins) {
    if (!mins || mins < 1) return;
    selectedDur[zoneId] = mins;
    // Update chip highlight and run button label without full re-render
    const card = document.getElementById(`card-${zoneId}`);
    if (!card) return;
    card.querySelectorAll('.chip').forEach(c => {
        c.classList.toggle('active', parseInt(c.textContent) === mins);
    });
    const runBtn = document.getElementById(`run-${zoneId}`);
    if (runBtn) runBtn.innerHTML = `<span class="material-icons" style="font-size:16px;">play_arrow</span> Run ${mins}m`;
}

// ── Zone name editing ──────────────────────────────────
function editName(zoneId) {
    const el   = document.getElementById(`name-${zoneId}`);
    const hint = document.getElementById(`hint-${zoneId}`);
    const current = el.textContent;
    el.outerHTML = `<input class="zone-name-input" id="name-${zoneId}" value="${esc(current)}"
        onblur="saveName(${zoneId})"
        onkeydown="if(event.key==='Enter') this.blur(); if(event.key==='Escape') cancelName(${zoneId}, '${esc(current)}')"
        autofocus>`;
    document.getElementById(`name-${zoneId}`).select();
}

function cancelName(zoneId, original) {
    const el = document.getElementById(`name-${zoneId}`);
    el.outerHTML = `<div class="zone-name" id="name-${zoneId}" onclick="editName(${zoneId})" title="Click to rename">${original}</div>`;
}

async function saveName(zoneId) {
    const el = document.getElementById(`name-${zoneId}`);
    if (!el) return;
    const name = el.value.trim() || `Zone ${zoneId}`;
    el.outerHTML = `<div class="zone-name" id="name-${zoneId}" onclick="editName(${zoneId})" title="Click to rename">${esc(name)}</div>`;

    // Update allZones cache
    const zone = allZones.find(z => z.id === zoneId);
    if (zone) zone.name = name;

    // Persist to server
    const r = await post('/api/settings', { action: 'update-zone-name', zone_id: zoneId, name });
    const hint = document.getElementById(`hint-${zoneId}`);
    if (hint) {
        hint.textContent = r.ok && r.data.success ? 'Saved ✓' : 'Save failed';
        hint.style.opacity = '1';
        setTimeout(() => { hint.style.opacity = '0'; hint.textContent = ''; }, 2000);
    }
}

// ── Zone control ───────────────────────────────────────
async function runZone(zoneId) {
    const dur = selectedDur[zoneId] ?? lastDur[zoneId] ?? 10;
    lastDur[zoneId] = dur;
    saveJson(LAST_DUR_KEY, lastDur);

    const r = await post('/api/zones/start', { zone_id: zoneId, duration: dur });
    if (r.ok && r.data.success) {
        toast(`Zone ${zoneId} started for ${dur} min`);
        await fetchStatus();
    } else {
        toast(r.data.error || 'Failed to start zone', 'error');
    }
}

async function stopAll() {
    const r = await post('/api/zones/stop-all', {});
    if (r.ok && r.data.success) {
        toast('Irrigation stopped');
        await fetchStatus();
    } else {
        toast(r.data.error || 'Failed to stop', 'error');
    }
}

async function adjustTime(delta) {
    const minus = document.getElementById('adjMinus');
    const plus  = document.getElementById('adjPlus');
    if (minus) minus.disabled = true;
    if (plus)  plus.disabled  = true;

    const r = await post('/api/zones/adjust', { delta });
    if (r.ok && r.data.success) {
        // Update local countdown to new time immediately
        if (activeZone) {
            activeZone.time_remaining = r.data.minutes * 60;
            activeZone.duration_seconds = r.data.minutes * 60;
            updateBanner();
        }
        toast(`${delta > 0 ? '+' : ''}${delta} min`);
    } else {
        toast(r.data.error || 'Adjust failed', 'error');
    }

    if (minus) minus.disabled = false;
    if (plus)  plus.disabled  = false;
}

// ── Status polling ─────────────────────────────────────
function startPolling() {
    fetchStatus();
    statusTimer = setInterval(fetchStatus, Math.max(2, refreshSec) * 1000);
}
function restartPolling() {
    clearInterval(statusTimer);
    startPolling();
}

async function fetchStatus() {
    if (!configured) return;
    try {
        const r = await fetch('/api/status');
        const d = await r.json();
        if (!d.success) { setConn('err', 'Error'); return; }

        const s = d.status;
        const was = activeZone && activeZone.zone_id;
        const irr = s.irrigation_state;

        if (irr.active && irr.zone) {
            const zone = allZones.find(z => z.id === irr.zone);
            activeZone = {
                zone_id: irr.zone,
                name: zone ? zone.name : `Zone ${irr.zone}`,
                time_remaining: irr.time_remaining,
                duration_seconds: irr.time_remaining // seed countdown from server
            };
            if (!was || was !== irr.zone) {
                startCountdown();
            }
        } else {
            const changed = !!was;
            activeZone = null;
            clearInterval(countdownTimer); countdownTimer = null;
            if (changed) renderZones();
        }

        updateBanner();
        if (!was !== !irr.active) renderZones(); // active state changed → re-render
        setConn('ok', s.rain_sensor && s.rain_sensor.active ? 'Rain delay' : 'Connected');
    } catch {
        setConn('err', 'Disconnected');
    }
}

function setConn(state, label) {
    document.getElementById('connDot').className = 'conn-dot ' + state;
    document.getElementById('connLabel').textContent = label;
}

// ── Countdown ──────────────────────────────────────────
function startCountdown() {
    clearInterval(countdownTimer);
    renderZones();
    updateBanner();
    countdownTimer = setInterval(() => {
        if (!activeZone) { clearInterval(countdownTimer); return; }
        activeZone.time_remaining = Math.max(0, activeZone.time_remaining - 1);
        updateBanner();
        // Update run button label live
        const card = document.getElementById(`card-${activeZone.zone_id}`);
        // (full card re-render avoided to keep inputs stable)
    }, 1000);
}

function updateBanner() {
    const banner = document.getElementById('activeBanner');
    if (!activeZone || !activeZone.zone_id) {
        banner.classList.remove('show');
        return;
    }
    banner.classList.add('show');
    document.getElementById('bannerZoneName').textContent = activeZone.name;
    document.getElementById('bannerTimer').textContent = fmt(activeZone.time_remaining);
}

function fmt(sec) {
    if (sec == null || sec <= 0) return '--:--';
    return `${Math.floor(sec / 60)}:${String(Math.floor(sec % 60)).padStart(2, '0')}`;
}

// ── Utilities ──────────────────────────────────────────
async function post(url, body) {
    try {
        const r = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        const data = await r.json();
        return { ok: true, data };
    } catch (e) {
        return { ok: false, data: { error: e.message } };
    }
}

function loadJson(key, def) {
    try { return JSON.parse(localStorage.getItem(key)) ?? def; } catch { return def; }
}
function saveJson(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toast(msg, type = '') {
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.textContent = msg;
    document.getElementById('toast-container').appendChild(el);
    setTimeout(() => {
        el.style.transition = 'opacity .3s';
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 300);
    }, 3200);
}
</script>
