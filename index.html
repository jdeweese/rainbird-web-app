<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RainBird Controller</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --brand: #2196f3;
            --brand-dark: #1976d2;
            --ok: #4caf50;
            --ok-dark: #388e3c;
            --danger: #f44336;
            --danger-dark: #d32f2f;
            --text: #333;
            --text-muted: #666;
            --border: #e0e0e0;
            --bg-subtle: #f5f7fa;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #e3f2fd 0%, #f3e5f5 100%);
            min-height: 100vh;
            color: var(--text);
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 16px;
        }

        /* --- Sticky header with connection dot --- */
        .header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: linear-gradient(135deg, var(--brand) 0%, #21cbf3 100%);
            color: white;
            padding: 14px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 16px rgba(33, 150, 243, 0.25);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header h1 {
            font-size: 1.25rem;
            font-weight: 400;
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        .conn-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ccc;
            flex-shrink: 0;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.2);
        }
        .conn-dot.ok { background: #4caf50; }
        .conn-dot.err { background: #f44336; }

        .header-status {
            font-size: 0.8rem;
            opacity: 0.9;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .icon-header-btn {
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
        }
        .icon-header-btn:hover { background: rgba(255, 255, 255, 0.28); }

        /* --- Active zone banner --- */
        .active-banner {
            background: linear-gradient(135deg, #e8f5e8 0%, #c8e6c9 100%);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 6px solid var(--ok);
            display: none;
        }
        .active-banner.visible { display: block; }

        .active-banner-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            flex-wrap: wrap;
        }

        .active-banner-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--ok-dark);
            font-weight: 500;
            margin-bottom: 4px;
        }

        .active-banner-zone {
            font-size: 1.5rem;
            font-weight: 500;
            color: #1b5e20;
        }

        .active-banner-countdown {
            font-size: 2.25rem;
            font-weight: 300;
            color: #1b5e20;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }

        .active-banner-countdown-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--ok-dark);
            text-align: right;
        }

        .progress-bar {
            margin-top: 16px;
            height: 8px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: var(--ok);
            transition: width 1s linear;
            border-radius: 4px;
        }

        .active-banner-stop {
            margin-top: 16px;
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background 0.2s ease;
        }
        .active-banner-stop:hover { background: var(--danger-dark); }

        /* --- Cards --- */
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
        }

        .card-title {
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 16px;
            color: var(--brand-dark);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* --- Empty state (first run) --- */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }
        .empty-state .material-icons {
            font-size: 56px;
            opacity: 0.4;
            margin-bottom: 12px;
        }
        .empty-state-title {
            font-size: 1.1rem;
            margin-bottom: 8px;
            color: var(--text);
        }
        .empty-state-body {
            font-size: 0.9rem;
            margin-bottom: 20px;
            max-width: 340px;
            margin-left: auto;
            margin-right: auto;
        }

        /* --- Zone search --- */
        .zone-toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            align-items: center;
        }
        .zone-search {
            flex: 1;
            padding: 10px 12px 10px 36px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            background: white url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='2'><circle cx='11' cy='11' r='7'/><line x1='21' y1='21' x2='16.65' y2='16.65'/></svg>") no-repeat 10px center;
        }
        .zone-search:focus {
            outline: none;
            border-color: var(--brand);
        }

        /* --- Zones grid --- */
        .zones-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 12px;
        }

        .zone-card {
            background: white;
            border-radius: 10px;
            padding: 16px;
            border: 2px solid var(--border);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .zone-card:hover {
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
        .zone-card.running {
            border-color: var(--ok);
            background: linear-gradient(135deg, #f1f8e9 0%, #e8f5e8 100%);
            order: -1;
        }

        .zone-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .zone-num {
            background: var(--bg-subtle);
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 500;
            padding: 2px 8px;
            border-radius: 10px;
            flex-shrink: 0;
        }

        .zone-card.running .zone-num {
            background: var(--ok);
            color: white;
        }

        .zone-name {
            flex: 1;
            font-size: 1rem;
            font-weight: 500;
            color: var(--text);
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .zone-name-input {
            flex: 1;
            border: 2px solid var(--brand);
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 1rem;
            font-weight: 500;
            font-family: inherit;
            outline: none;
            min-width: 0;
        }

        .zone-edit-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            opacity: 0;
            transition: opacity 0.15s ease, background 0.15s ease;
        }
        .zone-card:hover .zone-edit-btn,
        .zone-edit-btn:focus {
            opacity: 1;
        }
        .zone-edit-btn:hover {
            background: var(--bg-subtle);
            color: var(--text);
        }

        .zone-saved-hint {
            font-size: 0.7rem;
            color: var(--ok-dark);
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .zone-saved-hint.visible { opacity: 1; }

        /* --- Duration chips --- */
        .duration-chips {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .chip {
            background: var(--bg-subtle);
            border: 1px solid transparent;
            color: var(--text-muted);
            padding: 5px 10px;
            border-radius: 16px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .chip:hover {
            background: #e8eef5;
        }
        .chip.selected {
            background: var(--brand);
            color: white;
            border-color: var(--brand);
        }
        .chip.custom {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .chip-input {
            width: 36px;
            border: none;
            background: transparent;
            color: inherit;
            font-size: inherit;
            font-weight: inherit;
            text-align: center;
            padding: 0;
            -moz-appearance: textfield;
        }
        .chip-input::-webkit-outer-spin-button,
        .chip-input::-webkit-inner-spin-button { -webkit-appearance: none; }

        /* --- Zone actions --- */
        .zone-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .zone-start-btn {
            flex: 1;
            background: var(--ok);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background 0.15s ease;
        }
        .zone-start-btn:hover { background: var(--ok-dark); }
        .zone-start-btn:disabled {
            background: #bbb;
            cursor: not-allowed;
        }

        .zone-stop-btn {
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background 0.15s ease;
        }
        .zone-stop-btn:hover { background: var(--danger-dark); }

        /* --- Zone running mini-countdown --- */
        .zone-countdown {
            font-size: 0.8rem;
            color: var(--ok-dark);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
            font-variant-numeric: tabular-nums;
        }

        /* --- Toast messages --- */
        .messages {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 200;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 360px;
        }

        .message {
            padding: 12px 16px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: slideIn 0.25s ease;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
            background: white;
            font-size: 0.9rem;
        }
        .message.success { border-left: 4px solid var(--ok); color: #1b5e20; }
        .message.error { border-left: 4px solid var(--danger); color: #b71c1c; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* --- Popup --- */
        .popup-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .popup-overlay.visible { display: flex; }

        .popup-panel {
            background: white;
            border-radius: 12px;
            padding: 24px;
            max-width: 480px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .popup-title {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--brand-dark);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .close-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            padding: 6px;
            border-radius: 50%;
            display: flex;
            transition: background 0.15s ease;
        }
        .close-btn:hover { background: var(--bg-subtle); }

        .field {
            margin-bottom: 14px;
        }
        .field label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 4px;
            font-weight: 500;
        }
        .field input {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
        }
        .field input:focus {
            outline: none;
            border-color: var(--brand);
        }

        .popup-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-family: inherit;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary { background: var(--brand); color: white; }
        .btn-primary:hover { background: var(--brand-dark); }
        .btn-secondary { background: var(--bg-subtle); color: var(--text); }
        .btn-secondary:hover { background: #e4e9ef; }

        /* --- Mobile --- */
        @media (max-width: 600px) {
            .container { padding: 12px; }
            .zones-grid { grid-template-columns: 1fr; }
            .header h1 { font-size: 1.1rem; }
            .active-banner-countdown { font-size: 2rem; }
            .messages { top: 8px; right: 8px; left: 8px; max-width: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span class="material-icons">water_drop</span>
            <h1>RainBird</h1>
            <div class="header-status">
                <span class="conn-dot" id="connDot" aria-hidden="true"></span>
                <span id="connLabel">Connecting…</span>
            </div>
            <button class="icon-header-btn" onclick="openConfigPopup()" aria-label="Settings" title="Settings">
                <span class="material-icons">settings</span>
            </button>
        </div>

        <div class="messages" id="messages" aria-live="polite"></div>

        <!-- Active zone banner -->
        <div class="active-banner" id="activeBanner" aria-live="polite">
            <div class="active-banner-header">
                <div>
                    <div class="active-banner-label">Running now</div>
                    <div class="active-banner-zone" id="activeBannerZone">—</div>
                </div>
                <div>
                    <div class="active-banner-countdown-label">Time left</div>
                    <div class="active-banner-countdown" id="activeBannerCountdown">--:--</div>
                </div>
            </div>
            <div class="progress-bar">
                <div class="progress-bar-fill" id="activeBannerProgress" style="width: 0%"></div>
            </div>
            <button class="active-banner-stop" onclick="stopAllZones()" aria-label="Stop irrigation">
                <span class="material-icons">stop</span>
                Stop
            </button>
        </div>

        <!-- Zones -->
        <div class="card">
            <div class="card-title">
                <span class="material-icons">grass</span>
                Zones
            </div>
            <div class="zone-toolbar" id="zoneToolbar" style="display: none;">
                <input type="search" class="zone-search" id="zoneSearch"
                       placeholder="Search zones…" aria-label="Search zones">
            </div>
            <div class="zones-grid" id="zonesList">
                <div class="empty-state">
                    <span class="material-icons">hourglass_empty</span>
                    <div>Loading zones…</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings popup -->
    <div class="popup-overlay" id="configPopup" role="dialog" aria-labelledby="configTitle">
        <div class="popup-panel">
            <div class="popup-header">
                <div class="popup-title" id="configTitle">
                    <span class="material-icons">settings</span>
                    Settings
                </div>
                <button class="close-btn" onclick="closeConfigPopup()" aria-label="Close">
                    <span class="material-icons">close</span>
                </button>
            </div>
            <div class="field">
                <label for="controllerIp">Controller IP address</label>
                <div style="display:flex;gap:8px;align-items:center;">
                    <input type="text" id="controllerIp" inputmode="numeric" placeholder="192.168.1.100" style="flex:1;">
                    <button class="btn btn-secondary" id="scanBtn" onclick="scanForControllers()" title="Scan LAN for RainBird controllers" style="white-space:nowrap;flex-shrink:0;">
                        <span class="material-icons" style="font-size:18px;">wifi_find</span>
                        Scan
                    </button>
                </div>
                <div id="scanResults" style="display:none;margin-top:8px;border:1px solid var(--border);border-radius:6px;overflow:hidden;"></div>
            </div>
            <div class="field">
                <label for="controllerPassword">Password</label>
                <input type="password" id="controllerPassword" placeholder="Controller password">
            </div>
            <div class="field">
                <label for="refreshRate">Refresh interval (seconds)</label>
                <input type="number" id="refreshRate" min="2" max="60" placeholder="10">
            </div>
            <div class="field">
                <label for="visibleZonesInput">Visible zones (comma-separated, 1–19)</label>
                <input type="text" id="visibleZonesInput" placeholder="1, 2, 3">
            </div>
            <div class="popup-actions">
                <button class="btn btn-secondary" onclick="closeConfigPopup()">Cancel</button>
                <button class="btn btn-primary" onclick="saveConfigAndClose()">
                    <span class="material-icons">save</span>
                    Save
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- State ---
        const DEFAULT_DURATIONS = [5, 10, 15, 30, 45];
        const LAST_DURATION_KEY = 'rainbird_last_duration_per_zone';
        const VISIBLE_ZONES_KEY = 'rainbird_visible_zones';

        let allZones = [];          // [{id, name}]
        let visibleZoneIds = [];    // subset of zones to render
        let lastDurationByZone = loadLastDurations();
        let selectedDurationByZone = {}; // in-memory, falls back to last/10

        let activeZone = null;      // {zone_id, name, time_remaining, duration_seconds}
        let refreshIntervalSec = 10;
        let statusTimer = null;
        let countdownTimer = null;
        let searchFilter = '';
        let controllerConfigured = false;

        // --- Utilities ---
        function loadLastDurations() {
            try { return JSON.parse(localStorage.getItem(LAST_DURATION_KEY) || '{}'); }
            catch { return {}; }
        }
        function saveLastDurations() {
            localStorage.setItem(LAST_DURATION_KEY, JSON.stringify(lastDurationByZone));
        }

        function loadVisibleZones() {
            try {
                const stored = JSON.parse(localStorage.getItem(VISIBLE_ZONES_KEY) || 'null');
                if (Array.isArray(stored) && stored.length) return stored;
            } catch {}
            return null;
        }
        function saveVisibleZones(ids) {
            localStorage.setItem(VISIBLE_ZONES_KEY, JSON.stringify(ids));
        }

        function formatTime(seconds) {
            if (seconds == null || seconds <= 0) return '--:--';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        function getDurationForZone(zoneId) {
            return selectedDurationByZone[zoneId]
                ?? lastDurationByZone[zoneId]
                ?? 10;
        }

        // --- Init ---
        window.addEventListener('load', async () => {
            await loadConfigThenZones();
            startStatusMonitoring();
            document.addEventListener('visibilitychange', handleVisibilityChange);
        });

        async function loadConfigThenZones() {
            await loadConfig();
            await loadZones();
            renderZones();
        }

        function handleVisibilityChange() {
            if (document.hidden) {
                if (statusTimer) { clearInterval(statusTimer); statusTimer = null; }
            } else if (!statusTimer) {
                startStatusMonitoring();
            }
        }

        // --- Config ---
        async function loadConfig() {
            try {
                const res = await fetch('/api/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'load' })
                });
                const data = await res.json();
                if (data.success) {
                    const s = data.settings || {};
                    refreshIntervalSec = parseInt(s.refresh_interval) || 10;
                    controllerConfigured = !!(s.controller_ip && s.controller_password);

                    document.getElementById('controllerIp').value = s.controller_ip || '';
                    document.getElementById('controllerPassword').value = s.controller_password || '';
                    document.getElementById('refreshRate').value = refreshIntervalSec;

                    const visibleFromServer = Array.isArray(s.visible_zones) ? s.visible_zones : null;
                    const visibleFromLocal = loadVisibleZones();
                    visibleZoneIds = visibleFromServer
                        || visibleFromLocal
                        || deriveVisibleFromNames(s.zone_names);

                    document.getElementById('visibleZonesInput').value = visibleZoneIds.join(', ');
                }
            } catch (e) {
                console.warn('loadConfig failed', e);
            }
        }

        function deriveVisibleFromNames(zoneNames) {
            if (zoneNames && Object.keys(zoneNames).length) {
                return Object.keys(zoneNames).map(n => parseInt(n)).sort((a, b) => a - b);
            }
            // First-run fallback: show zones 1-4 until configured
            return [1, 2, 3, 4];
        }

        async function saveConfig() {
            const visibleRaw = document.getElementById('visibleZonesInput').value || '';
            const parsedVisible = visibleRaw
                .split(',')
                .map(s => parseInt(s.trim()))
                .filter(n => Number.isInteger(n) && n >= 1 && n <= 19);

            const settings = {
                controller_ip: document.getElementById('controllerIp').value.trim(),
                controller_password: document.getElementById('controllerPassword').value,
                refresh_interval: parseInt(document.getElementById('refreshRate').value) || 10,
                visible_zones: parsedVisible
            };

            try {
                const res = await fetch('/api/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'save', settings })
                });
                const data = await res.json();
                if (!data.success) throw new Error(data.error || 'save failed');
                saveVisibleZones(parsedVisible);
                showMessage('Settings saved', 'success');
                refreshIntervalSec = settings.refresh_interval;
                controllerConfigured = !!(settings.controller_ip && settings.controller_password);
                visibleZoneIds = parsedVisible.length ? parsedVisible : visibleZoneIds;
                renderZones();
                restartStatusMonitoring();
            } catch (e) {
                showMessage(`Failed to save settings: ${e.message}`, 'error');
            }
        }

        // --- Zones ---
        async function loadZones() {
            try {
                const res = await fetch('/api/zones');
                const data = await res.json();
                if (data.success) {
                    allZones = data.zones;
                } else {
                    showMessage(`Error loading zones: ${data.error}`, 'error');
                }
            } catch (e) {
                showMessage(`Failed to load zones: ${e.message}`, 'error');
            }
        }

        function renderZones() {
            const container = document.getElementById('zonesList');
            const toolbar = document.getElementById('zoneToolbar');

            if (!controllerConfigured) {
                toolbar.style.display = 'none';
                container.innerHTML = `
                    <div class="empty-state">
                        <span class="material-icons">settings_input_antenna</span>
                        <div class="empty-state-title">Connect your controller</div>
                        <div class="empty-state-body">
                            Enter your RainBird controller's IP address and password to get started.
                        </div>
                        <button class="btn btn-primary" onclick="openConfigPopup()">
                            <span class="material-icons">settings</span>
                            Open settings
                        </button>
                    </div>`;
                return;
            }

            if (!visibleZoneIds.length) {
                toolbar.style.display = 'none';
                container.innerHTML = `
                    <div class="empty-state">
                        <span class="material-icons">grass</span>
                        <div class="empty-state-title">No zones configured</div>
                        <div class="empty-state-body">
                            Add the zone numbers you want to control in settings.
                        </div>
                        <button class="btn btn-primary" onclick="openConfigPopup()">
                            <span class="material-icons">settings</span>
                            Choose zones
                        </button>
                    </div>`;
                return;
            }

            // Show toolbar only when there are enough zones to benefit
            toolbar.style.display = visibleZoneIds.length > 6 ? 'flex' : 'none';

            const zoneById = Object.fromEntries(allZones.map(z => [z.id, z]));
            const filtered = visibleZoneIds
                .map(id => zoneById[id])
                .filter(z => z)
                .filter(z => !searchFilter || z.name.toLowerCase().includes(searchFilter));

            if (!filtered.length) {
                container.innerHTML = `
                    <div class="empty-state">
                        <span class="material-icons">search_off</span>
                        <div>No zones match "${escapeHtml(searchFilter)}"</div>
                    </div>`;
                return;
            }

            container.innerHTML = filtered.map(renderZoneCard).join('');
        }

        function renderZoneCard(zone) {
            const isActive = activeZone && activeZone.zone_id === zone.id;
            const duration = getDurationForZone(zone.id);
            const presetChips = DEFAULT_DURATIONS.map(m => `
                <button type="button" class="chip ${m === duration ? 'selected' : ''}"
                        onclick="selectDuration(${zone.id}, ${m})"
                        aria-pressed="${m === duration}">${m}m</button>
            `).join('');
            const isCustom = !DEFAULT_DURATIONS.includes(duration);

            const runningMeta = isActive ? `
                <div class="zone-countdown" aria-label="Time remaining">
                    <span class="material-icons" style="font-size: 16px;">timer</span>
                    <span id="zone-countdown-${zone.id}">${formatTime(activeZone.time_remaining)}</span>
                </div>
            ` : '';

            return `
                <div class="zone-card ${isActive ? 'running' : ''}" id="zone-card-${zone.id}">
                    <div class="zone-header">
                        <span class="zone-num">Z${zone.id}</span>
                        <span class="zone-name" id="zone-name-${zone.id}">${escapeHtml(zone.name)}</span>
                        <span class="zone-saved-hint" id="zone-saved-${zone.id}">Saved</span>
                        <button class="zone-edit-btn" onclick="editZoneName(${zone.id})"
                                aria-label="Rename zone ${zone.id}" title="Rename">
                            <span class="material-icons" style="font-size: 18px;">edit</span>
                        </button>
                    </div>
                    ${isActive ? runningMeta : `
                        <div class="duration-chips" role="group" aria-label="Duration">
                            ${presetChips}
                            <label class="chip custom ${isCustom ? 'selected' : ''}" title="Custom duration">
                                <input type="number" class="chip-input" min="1" max="60"
                                       value="${isCustom ? duration : ''}"
                                       placeholder="…"
                                       aria-label="Custom minutes for zone ${zone.id}"
                                       onchange="selectCustomDuration(${zone.id}, this.value)">
                                m
                            </label>
                        </div>
                    `}
                    <div class="zone-actions">
                        ${isActive
                            ? `<button class="zone-stop-btn" onclick="stopAllZones()" style="flex:1;">
                                   <span class="material-icons">stop</span>
                                   Stop
                               </button>`
                            : `<button class="zone-start-btn" onclick="startZone(${zone.id})"
                                       ${activeZone ? 'disabled title="Another zone is running"' : ''}>
                                   <span class="material-icons">play_arrow</span>
                                   Start ${duration}m
                               </button>`
                        }
                    </div>
                </div>
            `;
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function selectDuration(zoneId, minutes) {
            selectedDurationByZone[zoneId] = minutes;
            lastDurationByZone[zoneId] = minutes;
            saveLastDurations();
            renderZones();
        }

        function selectCustomDuration(zoneId, raw) {
            const m = parseInt(raw);
            if (!Number.isFinite(m) || m < 1 || m > 60) return;
            selectedDurationByZone[zoneId] = m;
            lastDurationByZone[zoneId] = m;
            saveLastDurations();
            renderZones();
        }

        function editZoneName(zoneId) {
            const zone = allZones.find(z => z.id === zoneId);
            if (!zone) return;
            const nameEl = document.getElementById(`zone-name-${zoneId}`);
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'zone-name-input';
            input.value = zone.name;
            input.setAttribute('aria-label', `Zone ${zoneId} name`);
            nameEl.replaceWith(input);
            input.focus();
            input.select();

            const commit = async () => {
                input.removeEventListener('blur', commit);
                input.removeEventListener('keydown', onKey);
                const newName = input.value.trim() || `Zone ${zoneId}`;
                if (newName !== zone.name) {
                    zone.name = newName;
                    await saveZoneName(zoneId, newName);
                }
                renderZones();
            };
            const onKey = (e) => {
                if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
                else if (e.key === 'Escape') { input.value = zone.name; input.blur(); }
            };
            input.addEventListener('blur', commit);
            input.addEventListener('keydown', onKey);
        }

        async function saveZoneName(zoneId, name) {
            try {
                const res = await fetch('/api/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'update-zone-name', zone_id: zoneId, name })
                });
                const data = await res.json();
                if (data.success) {
                    showSavedHint(zoneId);
                } else {
                    showMessage('Failed to save zone name', 'error');
                }
            } catch (e) {
                showMessage(`Failed to save zone name: ${e.message}`, 'error');
            }
        }

        function showSavedHint(zoneId) {
            setTimeout(() => {
                const hint = document.getElementById(`zone-saved-${zoneId}`);
                if (!hint) return;
                hint.classList.add('visible');
                setTimeout(() => hint.classList.remove('visible'), 1200);
            }, 50);
        }

        // --- Start / stop ---
        async function startZone(zoneId) {
            const duration = getDurationForZone(zoneId);
            lastDurationByZone[zoneId] = duration;
            saveLastDurations();

            try {
                const res = await fetch('/api/zones/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ zone_id: zoneId, duration })
                });
                const data = await res.json();
                if (data.success) {
                    showMessage(data.message || `Zone ${zoneId} started`, 'success');
                    const zone = allZones.find(z => z.id === zoneId);
                    activeZone = {
                        zone_id: zoneId,
                        name: zone ? zone.name : `Zone ${zoneId}`,
                        time_remaining: duration * 60,
                        duration_seconds: duration * 60
                    };
                    renderZones();
                    renderActiveBanner();
                    startCountdown();
                    getStatus();
                } else {
                    showMessage(`Error: ${data.error}`, 'error');
                }
            } catch (e) {
                showMessage(`Failed to start zone: ${e.message}`, 'error');
            }
        }

        async function stopAllZones() {
            try {
                const res = await fetch('/api/zones/stop-all', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });
                const data = await res.json();
                if (data.success) {
                    showMessage(data.message || 'Stopped', 'success');
                    activeZone = null;
                    renderZones();
                    renderActiveBanner();
                } else {
                    showMessage(`Error: ${data.error}`, 'error');
                }
            } catch (e) {
                showMessage(`Failed to stop: ${e.message}`, 'error');
            }
        }

        // --- Status polling ---
        function startStatusMonitoring() {
            getStatus();
            statusTimer = setInterval(getStatus, Math.max(2, refreshIntervalSec) * 1000);
        }

        function restartStatusMonitoring() {
            if (statusTimer) clearInterval(statusTimer);
            startStatusMonitoring();
        }

        async function getStatus() {
            if (!controllerConfigured) {
                setConnDot('idle', 'Not configured');
                return;
            }
            try {
                const res = await fetch('/api/status');
                const data = await res.json();

                if (!data.success) {
                    setConnDot('err', 'Error');
                    return;
                }
                setConnDot('ok', 'Connected');

                const state = data.status.irrigation_state;
                if (state.active && state.zone) {
                    const zone = allZones.find(z => z.id === state.zone);
                    const prev = activeZone;
                    activeZone = {
                        zone_id: state.zone,
                        name: zone ? zone.name : `Zone ${state.zone}`,
                        time_remaining: state.time_remaining,
                        // Preserve original duration across polls so progress bar doesn't jump
                        duration_seconds: prev && prev.zone_id === state.zone
                            ? prev.duration_seconds
                            : Math.max(state.time_remaining, 1)
                    };
                    renderActiveBanner();
                    startCountdown();
                } else if (activeZone) {
                    activeZone = null;
                    renderZones();
                    renderActiveBanner();
                }
            } catch (e) {
                setConnDot('err', 'Disconnected');
            }
        }

        function setConnDot(state, label) {
            const dot = document.getElementById('connDot');
            const lbl = document.getElementById('connLabel');
            dot.classList.remove('ok', 'err');
            if (state === 'ok') dot.classList.add('ok');
            else if (state === 'err') dot.classList.add('err');
            lbl.textContent = label;
        }

        // --- Active banner + countdown ---
        function renderActiveBanner() {
            const banner = document.getElementById('activeBanner');
            if (!activeZone) {
                banner.classList.remove('visible');
                if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
                return;
            }
            banner.classList.add('visible');
            document.getElementById('activeBannerZone').textContent =
                `${activeZone.name} · Z${activeZone.zone_id}`;
            updateCountdownUI();
        }

        function updateCountdownUI() {
            if (!activeZone) return;
            document.getElementById('activeBannerCountdown').textContent =
                formatTime(activeZone.time_remaining);
            const pct = activeZone.duration_seconds > 0
                ? Math.max(0, Math.min(100,
                    100 - (activeZone.time_remaining / activeZone.duration_seconds) * 100))
                : 0;
            document.getElementById('activeBannerProgress').style.width = pct + '%';

            const zoneCountEl = document.getElementById(`zone-countdown-${activeZone.zone_id}`);
            if (zoneCountEl) zoneCountEl.textContent = formatTime(activeZone.time_remaining);
        }

        function startCountdown() {
            if (countdownTimer) clearInterval(countdownTimer);
            countdownTimer = setInterval(() => {
                if (!activeZone) {
                    clearInterval(countdownTimer); countdownTimer = null; return;
                }
                activeZone.time_remaining = Math.max(0, activeZone.time_remaining - 1);
                updateCountdownUI();
                if (activeZone.time_remaining <= 0) {
                    clearInterval(countdownTimer); countdownTimer = null;
                    // Force a status refresh to confirm the zone actually stopped
                    setTimeout(getStatus, 1500);
                }
            }, 1000);
        }

        // --- Messages ---
        function showMessage(message, type = 'success') {
            const container = document.getElementById('messages');
            const el = document.createElement('div');
            el.className = `message ${type}`;
            const icon = type === 'success' ? 'check_circle' : 'error';
            el.innerHTML = `<span class="material-icons">${icon}</span><span></span>`;
            el.querySelector('span:last-child').textContent = message;
            container.appendChild(el);
            setTimeout(() => {
                el.style.opacity = '0';
                el.style.transition = 'opacity 0.3s ease';
                setTimeout(() => el.remove(), 300);
            }, 3500);
        }

        // --- Popups ---
        function openConfigPopup() {
            loadConfig();
            document.getElementById('scanResults').style.display = 'none';
            document.getElementById('configPopup').classList.add('visible');
        }
        function closeConfigPopup() {
            document.getElementById('configPopup').classList.remove('visible');
        }
        async function saveConfigAndClose() {
            await saveConfig();
            closeConfigPopup();
        }

        // --- LAN scan ---
        async function scanForControllers() {
            const btn = document.getElementById('scanBtn');
            const resultsEl = document.getElementById('scanResults');

            btn.disabled = true;
            btn.innerHTML = '<span class="material-icons" style="font-size:18px;animation:spin 1s linear infinite;">refresh</span> Scanning…';
            resultsEl.style.display = 'none';
            resultsEl.innerHTML = '';

            try {
                const res = await fetch('/api/scan');
                const data = await res.json();
                const controllers = data.controllers || [];

                if (controllers.length === 0) {
                    resultsEl.innerHTML = `
                        <div style="padding:10px 12px;color:var(--text-muted);font-size:0.875rem;display:flex;align-items:center;gap:6px;">
                            <span class="material-icons" style="font-size:16px;">search_off</span>
                            No RainBird controllers found on this network
                        </div>`;
                } else {
                    resultsEl.innerHTML = controllers.map(ip => `
                        <button onclick="selectScannedIp('${ip}')" style="
                            display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;
                            background:none;border:none;border-bottom:1px solid var(--border);
                            cursor:pointer;font-size:0.9rem;color:var(--text);text-align:left;
                            transition:background 0.15s ease;"
                            onmouseover="this.style.background='var(--bg-subtle)'"
                            onmouseout="this.style.background='none'">
                            <span class="material-icons" style="font-size:18px;color:var(--ok);">router</span>
                            ${ip}
                            <span style="margin-left:auto;font-size:0.75rem;color:var(--text-muted);">tap to use</span>
                        </button>`).join('');
                    // Remove border from last item
                    resultsEl.querySelector('button:last-child').style.borderBottom = 'none';
                }
                resultsEl.style.display = 'block';
            } catch (e) {
                resultsEl.innerHTML = `
                    <div style="padding:10px 12px;color:var(--danger);font-size:0.875rem;">
                        Scan failed: ${e.message}
                    </div>`;
                resultsEl.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<span class="material-icons" style="font-size:18px;">wifi_find</span> Scan';
            }
        }

        function selectScannedIp(ip) {
            document.getElementById('controllerIp').value = ip;
            document.getElementById('scanResults').style.display = 'none';
            document.getElementById('controllerPassword').focus();
        }

        // --- Search ---
        document.addEventListener('input', (e) => {
            if (e.target && e.target.id === 'zoneSearch') {
                searchFilter = e.target.value.toLowerCase().trim();
                renderZones();
            }
        });
    </script>
</body>
</html>
